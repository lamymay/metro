org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.nonTransitiveRClass=true

# AGP 8 needs JDK 17; the login shell here defaults to a much newer JDK that Gradle
# does not support. Android Studio uses its bundled JBR and ignores this line.
org.gradle.java.home=/Users/may/Library/Java/JavaVirtualMachines/jbr-17.0.14/Contents/Home

# Required from minSdk 21 onward: the app now uses AndroidX + Jetpack Compose.
android.useAndroidX=true
